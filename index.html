<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122b52"><title>あといくら？｜買い物予算メモ</title><meta name="description" content="値段を入れるだけ。税込み合計と残り予算がひと目でわかる買い物メモ。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23122b52'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%23c9f35c'%3E¥%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#152c4f;background:#edf1f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #5284dc;outline-offset:3px}main{max-width:470px;margin:auto;padding:24px 20px 36px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.brand{font-size:21px;font-weight:800;letter-spacing:-.04em}.mark{display:inline-grid;place-items:center;width:29px;height:29px;margin-right:8px;background:#152c4f;color:#c9f35c;border-radius:9px;font-size:20px}.muted{font-size:14px;color:#627089}.budget{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.budget label{font-size:14px;font-weight:600}.budget-input{display:flex;align-items:center;gap:6px}.budget input{width:120px;text-align:right;border:1px solid #ccd4e1;border-radius:10px;background:white;padding:9px 12px;font-size:18px;font-weight:700;color:#152c4f}.balance{background:#122b52;color:white;border-radius:25px;padding:26px 25px 22px;box-shadow:0 9px 25px #142d5212}.balance .label{font-size:15px;color:#d8e3f4}.amount{font-size:clamp(39px,11vw,56px);font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;line-height:1.3;margin:6px 0 19px;overflow-wrap:anywhere;color:#d3f97c}.amount small{font-size:21px;font-weight:500;margin-left:6px}.over{background:#802c3c}.over .amount{color:#ffe1df}.total-row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #ffffff25;padding-top:16px;font-size:14px;color:#d8e3f4}.total-row strong{font-size:18px;color:white}.meter{height:5px;background:#ffffff20;border-radius:5px;margin-top:16px;overflow:hidden}.meter span{display:block;background:#c9f35c;height:100%;transition:width .2s}.entry{background:white;border:1px solid #dfe5ee;border-radius:23px;padding:20px;margin-top:18px}h2{font-size:16px;margin:0 0 15px;font-weight:700}.segmented{display:flex;background:#edf1f6;padding:4px;border-radius:12px;margin-bottom:17px}.segmented button{flex:1;border:0;background:none;color:#627089;padding:10px 2px;border-radius:9px;font-size:14px;font-weight:600}.segmented button[aria-pressed=true]{background:#122b52;color:white;box-shadow:0 2px 5px #152c4f20}.price-label{font-size:14px;color:#627089;display:block;margin-bottom:5px}.price-field{display:flex;align-items:center;gap:8px}.price-field input{width:100%;min-width:0;font-size:34px;font-weight:700;letter-spacing:-.03em;padding:6px 0;border:0;border-bottom:2px solid #e1e7ef;border-radius:0;color:#152c4f;background:white}.price-field input::placeholder{color:#a2aec0}.price-field span{font-size:18px}.preview{display:flex;justify-content:space-between;gap:8px;margin:13px 0 16px;font-size:14px;color:#627089}.preview strong{color:#152c4f;font-weight:650}.add{width:100%;border:0;border-radius:13px;background:#c9f35c;color:#183215;padding:15px;font-size:17px;font-weight:800}.add:disabled{background:#e9eef4;color:#8c98aa;cursor:default}.error{font-size:14px;color:#a92c3e;min-height:0;margin:10px 0 0}.list-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 10px}.list-head h2{margin:0}.text-button{border:0;background:transparent;padding:8px 0 8px 10px;color:#627089;font-size:14px}.text-button:disabled{opacity:.4;cursor:default}.empty{text-align:center;padding:24px 12px;color:#7b879b;font-size:14px;border:1px dashed #cbd4e1;border-radius:16px;line-height:1.9}.items{list-style:none;padding:0;margin:0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid #dbe2ed}.item-title{font-size:15px;font-weight:600}.item-sub{font-size:13px;color:#6b7890;margin-top:3px}.item-right{display:flex;align-items:center;gap:12px}.item-right strong{font-size:17px;font-variant-numeric:tabular-nums}.remove{border:0;background:#e3e9f1;border-radius:50%;width:32px;height:32px;font-size:20px;color:#65758d}.foot{font-size:12px;line-height:1.8;color:#748197;margin-top:18px}.flash{min-height:20px;font-size:13px;color:#50651a;margin:9px 0 -7px;text-align:center}dialog{border:0;border-radius:20px;padding:24px;max-width:340px;width:calc(100% - 40px);color:#152c4f}dialog::backdrop{background:#10234370}dialog p{font-size:15px;line-height:1.8}.dialog-buttons{display:flex;gap:10px}.dialog-buttons button{flex:1;border:0;border-radius:10px;padding:12px;font-size:14px;background:#edf1f6}.dialog-buttons .danger{background:#802c3c;color:white}@media(min-width:700px){main{padding-top:45px}}@media(max-width:350px){main{padding:18px 12px}.entry{padding:16px}.balance{padding:22px 20px}.segmented button{font-size:13px}}
</style></head>
<body><main>
<header><div class="brand"><span class="mark" aria-hidden="true">¥</span>あといくら？</div><span class="muted">買い物予算メモ</span></header>
<div class="budget"><label for="budget">今日の予算</label><div class="budget-input"><input id="budget" type="text" inputmode="numeric" value="5000" maxlength="8" aria-label="今日の予算（円）"><span>円</span></div></div>
<section class="balance" id="balance" aria-label="予算の残り"><div class="label" id="balance-label">あと買える金額</div><div class="amount"><span id="remaining">5,000</span><small>円</small></div><div class="total-row"><span>税込み合計 · <span id="count">0</span>点</span><strong id="total">0円</strong></div><div class="meter" aria-hidden="true"><span id="meter" style="width:0%"></span></div></section>
<section class="entry"><h2>商品の値段を入力</h2><div class="segmented" role="group" aria-label="値段の種類"><button type="button" data-rate="8" aria-pressed="true">税抜き 8%</button><button type="button" data-rate="10" aria-pressed="false">税抜き 10%</button><button type="button" data-rate="0" aria-pressed="false">税込み</button></div>
<form id="entry-form"><label class="price-label" for="price" id="price-label">税抜き価格</label><div class="price-field"><input id="price" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="例：198" maxlength="8" aria-describedby="price-preview"><span>円</span></div><div class="preview" id="price-preview"><span>追加する税込み額</span><strong id="gross-preview">— 円</strong></div><button class="add" id="add" disabled type="submit">買い物に追加</button><p id="error" class="error" role="alert" hidden></p></form><div class="flash" id="notice" role="status" aria-live="polite"></div></section>
<section><div class="list-head"><h2>追加した商品</h2><button class="text-button" id="undo" disabled>ひとつ戻す</button></div><div class="empty" id="empty">値段を入れて、買い物に追加。<br>ここに税込み額が並びます。</div><ul class="items" id="items"></ul></section>
<div class="list-head"><span class="muted" id="tax-note">8%：食品など / 10%：日用品・お酒など</span><button class="text-button" id="reset" disabled>リセット</button></div><p class="foot">税抜き価格は商品ごとに1円未満を切り上げて計算します。<br>お店の端数処理や割引で、レジの金額と差が出ることがあります。</p>
<dialog id="reset-dialog"><h2>買い物メモをリセット？</h2><p>追加した商品をすべて消します。予算はそのまま使えます。</p><div class="dialog-buttons"><button id="cancel-reset">やめる</button><button class="danger" id="confirm-reset">リセット</button></div></dialog>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let rate=8,budget=5000,items=[],sequence=0;
const yen=n=>n.toLocaleString('ja-JP');
function parseMoney(value){const normalized=String(value).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，\s]/g,'');return /^\d{1,8}$/.test(normalized)?Number(normalized):null;}
function gross(price,tax){return Math.ceil(price*(100+tax)/100);}
function summary(){const total=items.reduce((s,i)=>s+i.gross,0);return{budget,total,remaining:budget-total,count:items.length};}
function render(){const s=summary();$('remaining').textContent=yen(Math.abs(s.remaining));$('balance-label').textContent=s.remaining<0?'予算をオーバー':s.remaining===0?'予算ぴったり':'あと買える金額';$('balance').classList.toggle('over',s.remaining<0);$('total').textContent=yen(s.total)+'円';$('count').textContent=s.count;$('meter').style.width=(budget>0?Math.min(100,s.total/budget*100):s.total?100:0)+'%';$('empty').hidden=!!items.length;$('undo').disabled=$('reset').disabled=!items.length;$('items').replaceChildren(...items.slice().reverse().map(i=>{const li=document.createElement('li');li.className='item';const left=document.createElement('div');const title=document.createElement('div');title.className='item-title';title.textContent='商品 '+i.id;const sub=document.createElement('div');sub.className='item-sub';sub.textContent=i.rate?yen(i.price)+'円 + 税'+i.rate+'%':'税込み価格';left.append(title,sub);const right=document.createElement('div');right.className='item-right';const amount=document.createElement('strong');amount.textContent=yen(i.gross)+'円';const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','商品 '+i.id+' を削除');remove.addEventListener('click',()=>{items=items.filter(x=>x.id!==i.id);render();$('notice').textContent='商品 '+i.id+' を削除しました';});right.append(amount,remove);li.append(left,right);return li;}));preview();}
function preview(){const price=parseMoney($('price').value);$('add').disabled=price===null||price<=0;$('gross-preview').textContent=price!==null&&price>0?yen(gross(price,rate))+'円':'— 円';$('price-label').textContent=rate?'税抜き価格':'税込み価格';}
function addItem(price,tax){if(!Number.isInteger(price)||price<=0||price>99999999||![0,8,10].includes(tax))throw new Error('金額または税率が正しくありません');const item={id:++sequence,price,rate:tax,gross:gross(price,tax)};items.push(item);render();return summary();}
$('budget').addEventListener('input',()=>{const next=parseMoney($('budget').value);if(next!==null){budget=next;$('budget').removeAttribute('aria-invalid');render();}else{$('budget').setAttribute('aria-invalid','true');}});$('budget').addEventListener('blur',()=>{$('budget').value=budget;$('budget').removeAttribute('aria-invalid');});
$('price').addEventListener('input',()=>{preview();$('notice').textContent='';const invalid=$('price').value!==''&&parseMoney($('price').value)===null;$('error').hidden=!invalid;$('error').textContent=invalid?'金額は数字で入力してください。':'';});
document.querySelectorAll('[data-rate]').forEach(button=>button.addEventListener('click',()=>{rate=Number(button.dataset.rate);document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));preview();}));
$('entry-form').addEventListener('submit',e=>{e.preventDefault();const price=parseMoney($('price').value);if(price===null||price<=0)return;const amount=gross(price,rate);addItem(price,rate);$('price').value='';preview();$('notice').textContent=yen(amount)+'円を追加しました';$('price').focus();});
$('undo').addEventListener('click',()=>{const last=items.pop();render();if(last)$('notice').textContent=yen(last.gross)+'円の追加を戻しました';});
$('reset').addEventListener('click',()=>$('reset-dialog').showModal());$('cancel-reset').addEventListener('click',()=>$('reset-dialog').close());$('confirm-reset').addEventListener('click',()=>{items=[];sequence=0;render();$('notice').textContent='買い物メモをリセットしました';$('reset-dialog').close();});
if(document.modelContext?.registerTool){for(const tool of [{name:'get_shopping_budget',description:'Read the current shopping budget, tax-inclusive total and remaining amount.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>summary()},{name:'add_shopping_item',description:'Add one price to the current shopping list. Rate 0 means already tax-inclusive.',inputSchema:{type:'object',properties:{price:{type:'integer',minimum:1,maximum:99999999},taxRate:{type:'integer',enum:[0,8,10]}},required:['price','taxRate'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>addItem(input.price,input.taxRate)}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{});}catch{}}}
render();
</script></body></html>
